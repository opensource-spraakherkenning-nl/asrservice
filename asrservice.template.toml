[[endpoints]]
name = "landingpage"
path = "/"
mode = "LandingPage"
public = true

#----------------------------------- DUTCH ASR ----------------------------------------------

[[endpoints]]
name = "Dutch Speech Recognition"
description = "Transcribe dutch texts"
path = "/nl"  #project name will be appended automatically
mode = "Project"
background_services = [ "asrserver-nl" ]
status_pattern = ".*" #every line from stderr qualifies as a status message
command = "./asrservice_wrapper.sh"
args = [ "-p", "11001" ]
#automatically add arguments from the defined parameters on top of args
auto_add_args = true
public = false

[[endpoints.parameters]]
id = "diarization"
name = "Diarization"
description = "Enable diarization (speaker recognition). Note that this has a performance impact so if you don't need it you can best leave it off."
required = false
type = { parametertype = "Bool", default = false }
flag = "-d"

[[endpoints.parameters]]
id = "return_char_alignments"
name = "Return character alignments"
description = "Returns alignments on a character level"
required = false
type = { parametertype = "Bool", default = false }
flag = "-c"

[[endpoints.parameters]]
id = "minspeakers"
name = "Minimum number of speakers"
description = "Setting this helps diarization"
required = false
type = { parametertype = "Int" }
flag = "-m"

[[endpoints.parameters]]
id = "minspeakers"
name = "Maximum number of speakers"
description = "Setting this helps diarization"
required = false
type = { parametertype = "Int" }
flag = "-M"

[[endpoints.parameters]]
id = "inputwav"
name = "Input audio (Wav)"
description = "The file to be transcribed"
required = false
type = { parametertype = "File", filetype = "wav", filename = { nametype = "Pattern", value = "\\.wav$" } }
multiple = true

[[endpoints.parameters]]
id = "inputmp3"
name = "Input audio (Mp3)"
description = "The file to be transcribed"
required = false
type = { parametertype = "File", filetype = "mp3", filename = { nametype = "Pattern", value = "\\.mp3$" } }
multiple = true

[[endpoints.parameters]]
id = "inputogg"
name = "Input audio (Ogg)"
description = "The file to be transcribed"
required = false
type = { parametertype = "File", filetype = "ogg", filename = { nametype = "Pattern", value = "\\.ogg$" } }
multiple = true

[[endpoints.outputfiles]]
name = "Transcription Only"
type = "txt"
filename = { nametype = "Pattern", value = "\\.txt$" }

[[endpoints.outputfiles]]
name = "Timed transcription (with speaker attribution)"
type = "srt"
filename = { nametype = "Pattern", value = "\\.srt$" }

[[endpoints.outputfiles]]
name = "Timed transcription (with speaker attribution)"
type = "tsv"
filename = { nametype = "Pattern", value = "\\.tsv$" }

[[endpoints.outputfiles]]
name = "Timed transcription (with speaker attribution)"
type = "ctm"
filename = { nametype = "Pattern", value = "\\.ctm$" }

[[endpoints.outputfiles]]
name = "Timed transcription (with speaker attribution)"
type = "vtt"
filename = { nametype = "Pattern", value = "\\.vtt$" }

[[endpoints.outputfiles]]
name = "Timed transcription (with speaker attribution)"
type = "json"
filename = { nametype = "Pattern", value = "\\.json$" }


