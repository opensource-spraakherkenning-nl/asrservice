
#Note: Certain values in this TOML reference environment variables. If you see such variables (dollar syntax), it means
#      this file is still a template that needs to be passed through envsubst first before being accepted by CLAM.

name = "Automatic Speech Recognition Service"
description = "This webservice allows you to automatically transcribe audio files, it supports a variety of languages and is powered by WhisperX"
authors = [ "Maarten van Gompel" ]
affiliation = "CLST, Radboud University"
termsofservice = "$CLAM_TERMS_OF_SERVICE"
listen = "$CLAM_LISTEN"
#url is required if oauth is enabled, it must not have a trailing slash
url = "$CLAM_URL"
rootdir = "$CLAM_ROOT"
version = "0.4"

[license]
name = "GNU Affero General Public License"
id = "AGPL-3.0-only"
url = "https://www.gnu.org/licenses/agpl-3.0.en.html"

[contact]
name = "Maarten van Gompel"
url = "https://proycon.anaproy.nl"
email = "proycon@anaproy.nl"

[auth]
user_file = "$CLAM_USER_FILE"
salt = "$CLAM_SALT"
oauth_config_file = "$CLAM_OIDC_CONFIG_FILE"

[[filetypes]]
id = "txt"
name = "Plain Text (UTF-8)"
contenttype = "text/plain; charset=utf-8"

[[filetypes]]
id = "wav"
name = "Wave Audio"
contenttype = "audio/wav"

[[filetypes]]
id = "mp3"
name = "MP3 Audio"
contenttype = "audio/mpeg"

[[filetypes]]
id = "ogg"
name = "Ogg Audio"
contenttype = "audio/ogg"

[[filetypes]]
id = "srt"
name = "SubRip Text"
contenttype = "application/x-subrip"

[[filetypes]]
id = "tsv"
name = "Tab Separated Values"
contenttype = "text/tab-separated-values"

[[filetypes]]
id = "ctm"
name = "Conversation Time Marked Text"
contenttype = "text/plain"

[[filetypes]]
id = "vtt"
name = "WebVTT"
contenttype = "text/plain"

[[filetypes]]
id = "json"
name = "JSON"
contenttype = "application/json"

#---------------------------------------------------------------------------------

[[background_services]]
id = "asrserver-nl"
description = "Dutch Speech Recognition"
command = "./bgservice_wrapper.sh"
args = [ "$CLAM_ASR_MODEL", "$CLAM_DEVICE_TYPE", "$CLAM_PRECISION", "11001", "nl" ]
unload_time = 120
up_pattern = "READY.*" #the server sends this if it's ready to receive connections

